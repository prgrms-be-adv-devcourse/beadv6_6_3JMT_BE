apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: admin-settlement-delivery-retry
  labels:
    app.kubernetes.io/name: admin-service
    app.kubernetes.io/part-of: prompthub
    app.kubernetes.io/component: service
    app.kubernetes.io/managed-by: kustomize
rules:
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - delete
      - get
      - list
  - apiGroups:
      - batch
    resources:
      - cronjobs
    resourceNames:
      - settlement-weekly
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: admin-settlement-delivery-retry
  labels:
    app.kubernetes.io/name: admin-service
    app.kubernetes.io/part-of: prompthub
    app.kubernetes.io/component: service
    app.kubernetes.io/managed-by: kustomize
subjects:
  - kind: ServiceAccount
    name: admin-service
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: admin-settlement-delivery-retry
