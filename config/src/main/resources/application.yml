server:
  port: 8888

spring:
  application:
    name: config
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/configs/

management:
  endpoints:
    web:
      exposure:
        include: health, info

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        serviceName: ${spring.application.name}
  level:
    root: INFO
