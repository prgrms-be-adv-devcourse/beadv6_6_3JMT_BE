server:
  port: 18082

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?currentSchema=product_service
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  jackson:
    time-zone: Asia/Seoul
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: product-service
      auto-offset-reset: earliest
      enable-auto-commit: false
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      embedding:
        options:
          # 1536차원 — products-v1 매핑의 dense_vector, product.embedding vector(1536)과 맞물린다.
          # 바꾸려면 두 스키마와 저장된 임베딩을 함께 다시 만들어야 한다.
          model: text-embedding-3-small

grpc:
  server:
    port: ${PRODUCT_GRPC_SERVER_PORT}
  client:
    user-service:
      host: user-service
      port: ${USER_GRPC_SERVER_PORT}

cloud:
  aws:
    region: ${AWS_REGION}
    s3:
      bucket: ${AWS_S3_BUCKET}

elasticsearch:
  uris: ${ES_URIS}

prompthub:
  search:
    reconcile:
      fixed-delay-ms: 20000
    ranking:
      sales-weight: 0.3
      view-weight: 0.1
      rating-weight: 0.1
      freshness-weight: 0.2
      freshness-scale: 30d
      freshness-decay: 0.7

logging:
  level:
    com.prompthub.product: INFO
    # search 패키지가 빠져 있어 임베딩 생성·재조정 동작을 운영에서 확인할 수 없었다.
    # ProductEmbeddingUpdater·QueryEmbeddingCache가 여기에 속한다.
    com.prompthub.search: INFO
