server:
  port: 18085

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?currentSchema=settlement_service
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  jackson:
    time-zone: Asia/Seoul
  batch:
    job:
      enabled: false
  grpc:
    client:
      channel:
        user-service:
          target: ${USER_GRPC_TARGET:static://user-service:9081}

grpc:
  client:
    product-service:
      address: product-service:${PRODUCT_GRPC_SERVER_PORT}
    order-service:
      address: 'static://order-service:${ORDER_GRPC_SERVER_PORT}'
      negotiation-type: plaintext

settlement:
  delivery:
    grpc:
      internal-token: ${SETTLEMENT_USER_GRPC_TOKEN}
      deadline: 10s
