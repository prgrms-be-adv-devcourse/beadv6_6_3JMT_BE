spring:
  config:
    import: ""
  # datasource는 PostgresIntegrationTestSupport가 Testcontainers 컨테이너 주소로 주입한다.
  # H2를 쓰지 않는 이유는 그 클래스 주석 참고 — 스키마가 운영과 어긋나도 통과해버린다.
  flyway:
    enabled: true            # 테스트 스키마를 운영과 같은 마이그레이션으로 만든다
    schemas: product_service
    create-schemas: true
  jpa:
    hibernate:
      ddl-auto: none         # 스키마는 Flyway가 만든다 — Hibernate가 엔티티에서 만들지 않는다
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:9092
  ai:
    openai:
      # 오토컨피그가 EmbeddingModel 빈을 만들 때만 쓰는 더미다. 테스트는 실제 호출을 하지
      # 않는다 — EmbeddingClient를 fake로 대체한다.
      api-key: test-openai-key

eureka:
  client:
    enabled: false
