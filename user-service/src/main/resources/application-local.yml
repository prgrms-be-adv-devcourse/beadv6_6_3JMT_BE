server:
  port: 8081

grpc:
  server:
    enabled: true
    port: ${USER_GRPC_SERVER_PORT:9081}

spring:
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:prompthub}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Seoul
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
jwt:
  private-key: ${JWT_PRIVATE_KEY}
  public-key: ${JWT_PUBLIC_KEY}
  access-token-expire-seconds: 900
  refresh-token-expire-seconds: 604800

eureka:
  client:
    enabled: false

cors:
  allowed-origins: "http://localhost:3000"

user:
  grpc:
    seller-settlement:
      internal-token: ${AI_USER_GRPC_TOKEN:local-ai-user-token}
    seller-settlement-command:
      internal-token: ${SETTLEMENT_USER_GRPC_TOKEN:local-settlement-user-token}
