spring:
  application:
    name: notification-service
  config:
    import:
      - ${CONFIG_IMPORT:}
      - optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/prompthub}
    username: ${DB_USERNAME:chan}
    password: ${DB_PASSWORD:123}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      enable-auto-commit: false

notification:
  kafka:
    order-topic: ${ORDER_EVENT_TOPIC:order-events}
    consumer-group: ${ORDER_EVENT_CONSUMER_GROUP:notification-service}
    retry-interval-ms: ${KAFKA_RETRY_INTERVAL_MS:1000}
    max-retry-attempts: ${KAFKA_MAX_RETRY_ATTEMPTS:3}
  sse:
    max-connections-per-user: ${SSE_MAX_CONNECTIONS_PER_USER:5}
    timeout-millis: ${SSE_TIMEOUT_MILLIS:1800000}
    heartbeat-interval-millis: ${SSE_HEARTBEAT_INTERVAL_MILLIS:30000}

---

spring:
  config:
    activate:
      on-profile: local
  cloud:
    compatibility-verifier:
      enabled: false
    config:
      enabled: false

eureka:
  client:
    enabled: false
