server:
  port: 8085

spring:
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:promptHub}
    username: ${DB_USERNAME:promptHub}
    password: ${DB_PASSWORD:promptHub}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  batch:
    job:
      enabled: false
  grpc:
    client:
      channel:
        user-service:
          target: ${USER_GRPC_TARGET:static://localhost:9081}
settlement:
  execution:
    mode: service
  delivery:
    grpc:
      internal-token: ${SETTLEMENT_USER_GRPC_TOKEN:local-settlement-user-token}
      deadline: 10s
  manual-api:
    enabled: true

eureka:
  client:
    enabled: false
