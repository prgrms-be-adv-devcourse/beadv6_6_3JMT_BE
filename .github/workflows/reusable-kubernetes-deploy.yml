name: Reusable Kubernetes Application Deploy

on:
  workflow_call:
    inputs:
      release-manifest:
        description: Immutable image metadata keyed by service
        required: true
        type: string
      manifest-matrix:
        description: Services whose rendered Kubernetes manifests must be applied
        required: true
        type: string
      deploy-matrix:
        description: Ordered services to deploy
        required: true
        type: string
      config-consumer-matrix:
        description: Services that must reload a changed Config Server profile
        required: true
        type: string
      apply-all-manifests:
        description: Whether the common application overlay changed
        required: true
        type: boolean

permissions:
  contents: read

env:
  NAMESPACE: prompthub
  KUBECONFIG: /home/ubuntu/.kube/config

jobs:
  deploy-applications:
    name: Deploy Applications
    runs-on: [self-hosted, linux, deploy]
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate release inputs
        shell: bash
        env:
          RELEASE_MANIFEST: ${{ inputs.release-manifest }}
          MANIFEST_MATRIX: ${{ inputs.manifest-matrix }}
          DEPLOY_MATRIX: ${{ inputs.deploy-matrix }}
          CONFIG_CONSUMER_MATRIX: ${{ inputs.config-consumer-matrix }}
          APPLY_ALL_MANIFESTS: ${{ inputs.apply-all-manifests }}
        run: |
          set -euo pipefail

          owner_lc="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          allowed_services='[
            "config",
            "discovery",
            "user-service",
            "product-service",
            "order-service",
            "payment-service",
            "settlement-service",
            "admin-service",
            "ai-service",
            "apigateway"
          ]'
          allowed_config_consumers='[
            "user-service",
            "product-service",
            "order-service",
            "payment-service",
            "admin-service",
            "ai-service",
            "apigateway"
          ]'

          validate_matrix() {
            local name="$1"
            local matrix="$2"
            local allowlist="$3"

            jq -e \
              --argjson allowlist "$allowlist" \
              'type == "array" and
               length == (unique | length) and
               all(.[]; type == "string" and (. as $item | $allowlist | index($item) != null))' \
              <<< "$matrix" >/dev/null || {
                echo "$name is not a unique allowlisted JSON array: $matrix" >&2
                return 1
              }
          }

          jq -e 'type == "object"' <<< "$RELEASE_MANIFEST" >/dev/null
          validate_matrix MANIFEST_MATRIX "$MANIFEST_MATRIX" "$allowed_services"
          validate_matrix DEPLOY_MATRIX "$DEPLOY_MATRIX" "$allowed_services"
          validate_matrix CONFIG_CONSUMER_MATRIX "$CONFIG_CONSUMER_MATRIX" "$allowed_config_consumers"

          while IFS= read -r service; do
            jq -e --arg service "$service" 'index($service) != null' <<< "$allowed_services" >/dev/null
            jq -e --arg service "$service" 'index($service) != null' <<< "$DEPLOY_MATRIX" >/dev/null

            metadata_service="$(jq -r --arg service "$service" '.[$service].service' <<< "$RELEASE_MANIFEST")"
            image_uri="$(jq -r --arg service "$service" '.[$service].imageUri' <<< "$RELEASE_MANIFEST")"
            digest="$(jq -r --arg service "$service" '.[$service].digest' <<< "$RELEASE_MANIFEST")"
            immutable_ref="$(jq -r --arg service "$service" '.[$service].immutableRef' <<< "$RELEASE_MANIFEST")"
            repository="ghcr.io/${owner_lc}/prompthub-${service}"

            [ "$metadata_service" = "$service" ]
            [ "$image_uri" = "${repository}:${GITHUB_SHA}" ]
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            [ "$immutable_ref" = "${repository}@${digest}" ]
          done < <(jq -r 'keys[]' <<< "$RELEASE_MANIFEST")

          while IFS= read -r service; do
            jq -e --arg service "$service" 'index($service) != null' <<< "$DEPLOY_MATRIX" >/dev/null
          done < <(jq -r '.[]' <<< "$MANIFEST_MATRIX")

          if [ "$APPLY_ALL_MANIFESTS" = "true" ]; then
            jq -e --argjson allowed "$allowed_services" \
              'length == ($allowed | length) and (($allowed - .) | length == 0)' \
              <<< "$MANIFEST_MATRIX" >/dev/null
          fi

      - name: 매니페스트 정적 검증
        shell: bash
        run: bash scripts/validate-k8s-manifests.sh

      - name: 클러스터와 Secret 사전 확인
        shell: bash
        run: |
          set -euo pipefail

          command -v kubectl >/dev/null
          command -v jq >/dev/null
          test -r "$KUBECONFIG"

          kubectl config current-context
          kubectl wait --for=condition=Ready node --all --timeout=60s

          for statefulset in postgres redis kafka; do
            kubectl rollout status statefulset/"$statefulset" -n "$NAMESPACE" --timeout=5m
          done

          required_secrets=(
            postgres-secret
            runtime-secret
            jwt-secret
            payment-secret
            product-secret
            ai-secret
            ghcr-pull-secret
          )

          for secret in "${required_secrets[@]}"; do
            kubectl get secret "$secret" -n "$NAMESPACE" >/dev/null
          done

      - name: 변경 서비스 순차 배포, 실패 진단 후 rollback
        shell: bash
        env:
          RELEASE_MANIFEST: ${{ inputs.release-manifest }}
          MANIFEST_MATRIX: ${{ inputs.manifest-matrix }}
          DEPLOY_MATRIX: ${{ inputs.deploy-matrix }}
          CONFIG_CONSUMER_MATRIX: ${{ inputs.config-consumer-matrix }}
          APPLY_ALL_MANIFESTS: ${{ inputs.apply-all-manifests }}
        run: |
          set -Eeuo pipefail

          release_order=(
            config
            discovery
            user-service
            product-service
            order-service
            payment-service
            settlement-service
            admin-service
            ai-service
            apigateway
          )
          deployment_order=(
            config
            discovery
            user-service
            product-service
            order-service
            payment-service
            admin-service
            ai-service
            apigateway
          )
          settlement_cronjob="settlement-weekly"
          runtime_overlay="k8s/overlays/ec2-kubeadm/.runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rendered_manifest="${RUNNER_TEMP}/prompthub-rendered-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.yaml"
          manifest_snapshot_dir="${RUNNER_TEMP}/prompthub-snapshot-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          updated_deployments=()
          created_deployments=()
          active_service=""
          config_updated="false"
          settlement_cronjob_previous_image=""
          settlement_cronjob_existed="false"
          settlement_cronjob_updated="false"
          declare -A desired_images=()

          cleanup() {
            rm -rf "$runtime_overlay" "$manifest_snapshot_dir"
            rm -f "$rendered_manifest"
          }
          trap cleanup EXIT

          matrix_contains() {
            local matrix="$1"
            local service="$2"
            jq -e --arg service "$service" 'index($service) != null' <<< "$matrix" >/dev/null
          }

          was_updated() {
            local candidate="$1"
            local deployment

            for deployment in "${updated_deployments[@]}"; do
              if [ "$deployment" = "$candidate" ]; then
                return 0
              fi
            done
            return 1
          }

          was_created() {
            local candidate="$1"
            local deployment

            for deployment in "${created_deployments[@]}"; do
              if [ "$deployment" = "$candidate" ]; then
                return 0
              fi
            done
            return 1
          }

          manifest_file_for() {
            case "$1" in
              config) echo "k8s/base/platform/config/deployment.yaml" ;;
              discovery) echo "k8s/base/platform/discovery/deployment.yaml" ;;
              user-service) echo "k8s/base/services/user/deployment.yaml" ;;
              product-service) echo "k8s/base/services/product/deployment.yaml" ;;
              order-service) echo "k8s/base/services/order/deployment.yaml" ;;
              payment-service) echo "k8s/base/services/payment/deployment.yaml" ;;
              settlement-service) echo "k8s/base/services/settlement/cronjob.yaml" ;;
              admin-service) echo "k8s/base/services/admin/deployment.yaml" ;;
              ai-service) echo "k8s/base/services/ai/deployment.yaml" ;;
              apigateway) echo "k8s/base/gateway/deployment.yaml" ;;
              *)
                echo "Unknown service: $1" >&2
                return 1
                ;;
            esac
          }

          current_or_base_image() {
            local service="$1"
            local image=""
            local manifest_file

            if image="$(jq -er --arg service "$service" '.[$service].immutableRef // empty' <<< "$RELEASE_MANIFEST")"; then
              echo "$image"
              return
            fi

            if [ "$service" = "settlement-service" ]; then
              image="$(kubectl get cronjob "$settlement_cronjob" -n "$NAMESPACE" \
                -o jsonpath="{.spec.jobTemplate.spec.template.spec.containers[?(@.name=='settlement-service')].image}" \
                2>/dev/null || true)"
            else
              image="$(kubectl get deployment "$service" -n "$NAMESPACE" \
                -o jsonpath="{.spec.template.spec.containers[?(@.name=='$service')].image}" \
                2>/dev/null || true)"
            fi

            if [ -n "$image" ]; then
              echo "$image"
              return
            fi

            manifest_file="$(manifest_file_for "$service")"
            image="$(awk -v repository="prompthub-${service}" \
              '$1 == "image:" && index($2, repository) > 0 {print $2; exit}' "$manifest_file")"

            if [ -z "$image" ]; then
              echo "Base image not found for $service in $manifest_file" >&2
              return 1
            fi
            echo "$image"
          }

          append_image_override() {
            local service="$1"
            local image="$2"
            local base_name="ghcr.io/prgrms-be-adv-devcourse/prompthub-${service}"
            local new_name
            local value

            if [[ "$image" == *@sha256:* ]]; then
              new_name="${image%@*}"
              value="${image#*@}"
              cat >> "$runtime_overlay/kustomization.yaml" <<EOF
            - name: $base_name
              newName: $new_name
              digest: $value
          EOF
            else
              new_name="${image%:*}"
              value="${image##*:}"
              cat >> "$runtime_overlay/kustomization.yaml" <<EOF
            - name: $base_name
              newName: $new_name
              newTag: $value
          EOF
            fi
          }

          render_application_overlay() {
            mkdir -p "$runtime_overlay"
            cat > "$runtime_overlay/kustomization.yaml" <<EOF
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          resources:
            - ../applications
          images:
          EOF

            for service in "${release_order[@]}"; do
              desired_images["$service"]="$(current_or_base_image "$service")"
              append_image_override "$service" "${desired_images[$service]}"
            done

            kubectl kustomize "$runtime_overlay" > "$rendered_manifest"
            test -s "$rendered_manifest"
          }

          snapshot_workloads() {
            local deployment

            mkdir -p "$manifest_snapshot_dir"
            for deployment in "${deployment_order[@]}"; do
              if kubectl get deployment "$deployment" -n "$NAMESPACE" -o json 2>/dev/null |
                jq -cS '.spec.template' > "$manifest_snapshot_dir/$deployment.template.json"; then
                continue
              fi
              rm -f "$manifest_snapshot_dir/$deployment.template.json"
              : > "$manifest_snapshot_dir/$deployment.missing"
            done

            if settlement_cronjob_previous_image="$(kubectl get cronjob "$settlement_cronjob" -n "$NAMESPACE" \
              -o jsonpath="{.spec.jobTemplate.spec.template.spec.containers[?(@.name=='settlement-service')].image}" \
              2>/dev/null)"; then
              if [ -z "$settlement_cronjob_previous_image" ]; then
                echo "CronJob/$settlement_cronjob 에 settlement-service 컨테이너 이미지가 없습니다." >&2
                return 1
              fi
              settlement_cronjob_existed="true"
            fi
          }

          track_deployment_change() {
            local deployment="$1"
            local current_template
            local previous_template

            if [ -f "$manifest_snapshot_dir/$deployment.missing" ]; then
              if kubectl get deployment "$deployment" -n "$NAMESPACE" >/dev/null 2>&1 &&
                ! was_created "$deployment"; then
                created_deployments+=("$deployment")
              fi
              return
            fi

            current_template="$(kubectl get deployment "$deployment" -n "$NAMESPACE" -o json |
              jq -cS '.spec.template')"
            previous_template="$(< "$manifest_snapshot_dir/$deployment.template.json")"
            if [ "$current_template" != "$previous_template" ] && ! was_updated "$deployment"; then
              updated_deployments+=("$deployment")
            fi
          }

          workload_exists() {
            local service="$1"
            if [ "$service" = "settlement-service" ]; then
              kubectl get cronjob "$settlement_cronjob" -n "$NAMESPACE" >/dev/null 2>&1
            else
              kubectl get deployment "$service" -n "$NAMESPACE" >/dev/null 2>&1
            fi
          }

          verify_settlement_image() {
            local expected="$1"
            local actual
            actual="$(kubectl get cronjob "$settlement_cronjob" -n "$NAMESPACE" \
              -o jsonpath="{.spec.jobTemplate.spec.template.spec.containers[?(@.name=='settlement-service')].image}")"
            if [ "$actual" != "$expected" ]; then
              echo "CronJob 이미지 검증 실패: expected=$expected actual=$actual" >&2
              return 1
            fi
          }

          apply_service_manifest() {
            local service="$1"
            local selector="app.kubernetes.io/name=$service"

            echo "매니페스트 적용: $service"
            kubectl apply --dry-run=server -n "$NAMESPACE" -l "$selector" -f "$rendered_manifest"
            if [ "$service" = "settlement-service" ]; then
              settlement_cronjob_updated="true"
            fi
            kubectl apply -n "$NAMESPACE" -l "$selector" -f "$rendered_manifest"

            if [ "$service" = "settlement-service" ]; then
              verify_settlement_image "${desired_images[$service]}"
            else
              track_deployment_change "$service"
              kubectl rollout status deployment/"$service" -n "$NAMESPACE" --timeout=10m
            fi
          }

          update_service_image() {
            local service="$1"
            local image="${desired_images[$service]}"
            local current_image

            if [ "$service" = "settlement-service" ]; then
              current_image="$(kubectl get cronjob "$settlement_cronjob" -n "$NAMESPACE" \
                -o jsonpath="{.spec.jobTemplate.spec.template.spec.containers[?(@.name=='settlement-service')].image}")"
              if [ "$current_image" = "$image" ]; then
                echo "이미 배포된 이미지이므로 건너뜁니다: $service -> $image"
                return
              fi

              kubectl set image cronjob/"$settlement_cronjob" settlement-service="$image" -n "$NAMESPACE"
              kubectl annotate cronjob/"$settlement_cronjob" \
                kubernetes.io/change-cause="GitHub Actions $GITHUB_SHA" -n "$NAMESPACE" --overwrite
              settlement_cronjob_updated="true"
              verify_settlement_image "$image"
              return
            fi

            current_image="$(kubectl get deployment "$service" -n "$NAMESPACE" \
              -o jsonpath="{.spec.template.spec.containers[?(@.name=='$service')].image}")"
            if [ "$current_image" = "$image" ]; then
              echo "이미 배포된 이미지이므로 건너뜁니다: $service -> $image"
              return
            fi

            kubectl set image deployment/"$service" "$service=$image" -n "$NAMESPACE"
            if ! was_updated "$service"; then
              updated_deployments+=("$service")
            fi
            kubectl annotate deployment/"$service" \
              kubernetes.io/change-cause="GitHub Actions $GITHUB_SHA" -n "$NAMESPACE" --overwrite
            kubectl rollout status deployment/"$service" -n "$NAMESPACE" --timeout=10m
          }

          dump_failure_diagnostics() {
            local service="$1"
            local selector="app.kubernetes.io/name=$service"

            echo "::group::실패 진단 - $service"
            if [ "$service" = "settlement-service" ]; then
              kubectl describe cronjob/"$settlement_cronjob" -n "$NAMESPACE" || true
              kubectl get jobs,pods -n "$NAMESPACE" -l "$selector" -o wide || true
            else
              kubectl describe deployment/"$service" -n "$NAMESPACE" || true
              kubectl get replicaset,pods -n "$NAMESPACE" -l "$selector" -o wide || true
              kubectl describe pods -n "$NAMESPACE" -l "$selector" || true
            fi
            kubectl get events -n "$NAMESPACE" --sort-by=.lastTimestamp | tail -n 80 || true
            kubectl describe nodes | sed -n '/Allocated resources:/,/Events:/p' || true
            echo "::endgroup::"
          }

          rollback() {
            local exit_code="$?"
            local index
            local deployment
            local consumer

            trap - ERR
            set +e

            if [ -n "$active_service" ]; then
              dump_failure_diagnostics "$active_service"
              if [ "$active_service" != "settlement-service" ] &&
                workload_exists "$active_service"; then
                track_deployment_change "$active_service" || true
              fi
            fi
            echo "배포 실패: 이번 실행에서 변경한 workload를 rollback 합니다."

            if [ "$settlement_cronjob_updated" = "true" ]; then
              if [ "$settlement_cronjob_existed" = "true" ]; then
                kubectl set image cronjob/"$settlement_cronjob" \
                  settlement-service="$settlement_cronjob_previous_image" -n "$NAMESPACE"
              else
                kubectl delete cronjob/"$settlement_cronjob" -n "$NAMESPACE" --ignore-not-found
              fi
            fi

            for ((index=${#updated_deployments[@]} - 1; index >= 0; index--)); do
              deployment="${updated_deployments[$index]}"
              kubectl rollout undo deployment/"$deployment" -n "$NAMESPACE"
            done

            for ((index=${#created_deployments[@]} - 1; index >= 0; index--)); do
              deployment="${created_deployments[$index]}"
              kubectl delete deployment/"$deployment" -n "$NAMESPACE" --ignore-not-found
            done

            for deployment in "${updated_deployments[@]}"; do
              if ! was_created "$deployment"; then
                kubectl rollout status deployment/"$deployment" -n "$NAMESPACE" --timeout=10m
              fi
            done

            if [ "$config_updated" = "true" ]; then
              echo "Config rollback 값을 다시 읽도록 대상 소비 서비스를 재시작합니다."
              while IFS= read -r consumer; do
                kubectl rollout restart deployment/"$consumer" -n "$NAMESPACE"
                kubectl rollout status deployment/"$consumer" -n "$NAMESPACE" --timeout=10m
              done < <(jq -r '.[]' <<< "$CONFIG_CONSUMER_MATRIX")
            fi

            exit "$exit_code"
          }
          trap rollback ERR

          render_application_overlay
          snapshot_workloads

          for service in "${release_order[@]}"; do
            if ! matrix_contains "$DEPLOY_MATRIX" "$service"; then
              continue
            fi

            active_service="$service"
            apply_manifest="false"
            if [ "$APPLY_ALL_MANIFESTS" = "true" ] ||
              matrix_contains "$MANIFEST_MATRIX" "$service" ||
              ! workload_exists "$service"; then
              apply_manifest="true"
            fi

            if [ "$apply_manifest" = "true" ]; then
              apply_service_manifest "$service"
            else
              update_service_image "$service"
            fi

            if [ "$service" = "config" ]; then
              config_updated="true"
            fi
          done

          if [ "$config_updated" = "true" ]; then
            echo "새 Config 값을 읽도록 변경 대상 소비 서비스를 순차 재시작합니다."
            while IFS= read -r consumer; do
              if was_updated "$consumer"; then
                continue
              fi
              active_service="$consumer"
              kubectl rollout restart deployment/"$consumer" -n "$NAMESPACE"
              updated_deployments+=("$consumer")
              kubectl rollout status deployment/"$consumer" -n "$NAMESPACE" --timeout=10m
            done < <(jq -r '.[]' <<< "$CONFIG_CONSUMER_MATRIX")
          fi

          # CronJob 전환 이후 legacy 정리 실패가 새 CronJob까지 rollback하지 않게 한다.
          trap - ERR
          if [ "$APPLY_ALL_MANIFESTS" = "true" ] ||
            matrix_contains "$MANIFEST_MATRIX" settlement-service; then
            kubectl delete deployment/settlement-service -n "$NAMESPACE" --ignore-not-found
            kubectl delete service/settlement-service -n "$NAMESPACE" --ignore-not-found
          fi

          kubectl get deployment -n "$NAMESPACE" \
            -o custom-columns=NAME:.metadata.name,READY:.status.readyReplicas,IMAGE:.spec.template.spec.containers[0].image
          kubectl get cronjob "$settlement_cronjob" -n "$NAMESPACE" \
            -o custom-columns=NAME:.metadata.name,SCHEDULE:.spec.schedule,IMAGE:.spec.jobTemplate.spec.template.spec.containers[0].image
