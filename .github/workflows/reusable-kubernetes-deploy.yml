name: Reusable Kubernetes Application Deploy

on:
  workflow_call:
    inputs:
      release-manifest:
        description: Immutable image metadata keyed by service
        required: true
        type: string
      application-manifests-changed:
        description: Whether Kubernetes application manifests changed
        required: true
        type: boolean

permissions:
  contents: read

env:
  NAMESPACE: prompthub
  KUBECONFIG: /home/ubuntu/.kube/config

jobs:
  deploy-applications:
    name: Deploy Applications
    runs-on: [self-hosted, linux, deploy]
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate immutable release manifest
        shell: bash
        env:
          RELEASE_MANIFEST: ${{ inputs.release-manifest }}
        run: |
          set -euo pipefail

          owner_lc="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          allowed_services='[
            "config",
            "discovery",
            "user-service",
            "product-service",
            "order-service",
            "payment-service",
            "settlement-service",
            "admin-service",
            "ai-service",
            "apigateway"
          ]'

          jq -e 'type == "object"' <<< "$RELEASE_MANIFEST" >/dev/null

          while IFS= read -r service; do
            jq -e --arg service "$service" 'index($service) != null' <<< "$allowed_services" >/dev/null

            metadata_service="$(jq -r --arg service "$service" '.[$service].service' <<< "$RELEASE_MANIFEST")"
            image_uri="$(jq -r --arg service "$service" '.[$service].imageUri' <<< "$RELEASE_MANIFEST")"
            digest="$(jq -r --arg service "$service" '.[$service].digest' <<< "$RELEASE_MANIFEST")"
            immutable_ref="$(jq -r --arg service "$service" '.[$service].immutableRef' <<< "$RELEASE_MANIFEST")"
            repository="ghcr.io/${owner_lc}/prompthub-${service}"

            [ "$metadata_service" = "$service" ]
            [ "$image_uri" = "${repository}:${GITHUB_SHA}" ]
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            [ "$immutable_ref" = "${repository}@${digest}" ]
          done < <(jq -r 'keys[]' <<< "$RELEASE_MANIFEST")

      - name: 매니페스트 정적 검증
        shell: bash
        run: bash scripts/validate-k8s-manifests.sh

      - name: 클러스터와 Secret 사전 확인
        shell: bash
        run: |
          set -euo pipefail

          command -v kubectl >/dev/null
          command -v jq >/dev/null
          test -r "$KUBECONFIG"

          kubectl config current-context
          kubectl wait --for=condition=Ready node --all --timeout=60s

          for statefulset in postgres redis kafka; do
            kubectl rollout status statefulset/"$statefulset" -n "$NAMESPACE" --timeout=5m
          done

          required_secrets=(
            postgres-secret
            runtime-secret
            jwt-secret
            payment-secret
            product-secret
            ai-secret
            ghcr-pull-secret
          )

          for secret in "${required_secrets[@]}"; do
            kubectl get secret "$secret" -n "$NAMESPACE" >/dev/null
          done

      - name: 최초 애플리케이션 리소스 준비
        if: inputs.application-manifests-changed == false
        shell: bash
        run: |
          set -euo pipefail

          ensure_package() {
            local deployment="$1"
            local service="$2"
            local package="$3"

            if ! kubectl get deployment "$deployment" -n "$NAMESPACE" >/dev/null 2>&1 ||
              ! kubectl get service "$service" -n "$NAMESPACE" >/dev/null 2>&1; then
              kubectl apply -k "$package"
            fi
          }

          ensure_settlement_cronjob() {
            if ! kubectl get cronjob settlement-weekly -n "$NAMESPACE" >/dev/null 2>&1; then
              kubectl apply -k k8s/base/services/settlement
            fi
          }

          ensure_package config config k8s/base/platform/config
          ensure_package discovery discovery k8s/base/platform/discovery

          ensure_package user-service user-service k8s/base/services/user
          ensure_package product-service product-service k8s/base/services/product
          ensure_package order-service order-service k8s/base/services/order
          ensure_package payment-service payment-service k8s/base/services/payment
          ensure_settlement_cronjob
          ensure_package admin-service admin-service k8s/base/services/admin
          ensure_package ai-service ai-service k8s/base/services/ai
          ensure_package apigateway apigateway k8s/base/gateway

          kubectl get cronjob settlement-weekly -n "$NAMESPACE" >/dev/null

      - name: 애플리케이션 리소스와 이미지 배포, 실패 시 rollback
        shell: bash
        env:
          RELEASE_MANIFEST: ${{ inputs.release-manifest }}
          APPLICATION_MANIFESTS_CHANGED: ${{ inputs.application-manifests-changed }}
        run: |
          set -Eeuo pipefail

          runtime_overlay=""
          manifest_snapshot_dir=""
          release_order=(
            config
            discovery
            user-service
            product-service
            order-service
            payment-service
            settlement-service
            admin-service
            ai-service
            apigateway
          )
          deployment_order=(
            config
            discovery
            user-service
            product-service
            order-service
            payment-service
            admin-service
            ai-service
            apigateway
          )
          config_consumers=(
            user-service
            product-service
            order-service
            payment-service
            admin-service
            ai-service
            apigateway
          )
          updated_deployments=()
          created_deployments=()
          config_updated="false"
          settlement_cronjob="settlement-weekly"
          settlement_cronjob_previous_image=""
          settlement_cronjob_existed="false"
          settlement_cronjob_updated="false"
          settlement_cronjob_snapshot_taken="false"
          declare -A desired_images=()

          cleanup_runtime_overlay() {
            if [ -n "$runtime_overlay" ]; then
              rm -rf "$runtime_overlay"
            fi
            if [ -n "$manifest_snapshot_dir" ]; then
              rm -rf "$manifest_snapshot_dir"
            fi
          }

          trap cleanup_runtime_overlay EXIT

          was_updated() {
            local candidate="$1"
            local deployment

            for deployment in "${updated_deployments[@]}"; do
              if [ "$deployment" = "$candidate" ]; then
                return 0
              fi
            done

            return 1
          }

          was_created() {
            local candidate="$1"
            local deployment

            for deployment in "${created_deployments[@]}"; do
              if [ "$deployment" = "$candidate" ]; then
                return 0
              fi
            done

            return 1
          }

          manifest_file_for() {
            case "$1" in
              config) echo "k8s/base/platform/config/deployment.yaml" ;;
              discovery) echo "k8s/base/platform/discovery/deployment.yaml" ;;
              user-service) echo "k8s/base/services/user/deployment.yaml" ;;
              product-service) echo "k8s/base/services/product/deployment.yaml" ;;
              order-service) echo "k8s/base/services/order/deployment.yaml" ;;
              payment-service) echo "k8s/base/services/payment/deployment.yaml" ;;
              settlement-service) echo "k8s/base/services/settlement/cronjob.yaml" ;;
              admin-service) echo "k8s/base/services/admin/deployment.yaml" ;;
              ai-service) echo "k8s/base/services/ai/deployment.yaml" ;;
              apigateway) echo "k8s/base/gateway/deployment.yaml" ;;
              *)
                echo "Unknown service: $1" >&2
                return 1
                ;;
            esac
          }

          current_or_base_image() {
            local service="$1"
            local image=""
            local manifest_file

            if image="$(jq -er --arg service "$service" '.[$service].immutableRef // empty' <<< "$RELEASE_MANIFEST")"; then
              echo "$image"
              return
            fi

            if [ "$service" = "settlement-service" ]; then
              image="$(kubectl get cronjob "$settlement_cronjob" -n "$NAMESPACE" \
                -o jsonpath="{.spec.jobTemplate.spec.template.spec.containers[?(@.name=='settlement-service')].image}" \
                2>/dev/null || true)"
            else
              image="$(kubectl get deployment "$service" -n "$NAMESPACE" \
                -o jsonpath="{.spec.template.spec.containers[?(@.name=='$service')].image}" \
                2>/dev/null || true)"
            fi

            if [ -n "$image" ]; then
              echo "$image"
              return
            fi

            manifest_file="$(manifest_file_for "$service")"
            image="$(awk -v repository="prompthub-${service}" \
              '$1 == "image:" && index($2, repository) > 0 {print $2; exit}' "$manifest_file")"

            if [ -z "$image" ]; then
              echo "Base image not found for $service in $manifest_file" >&2
              return 1
            fi

            echo "$image"
          }

          append_image_override() {
            local service="$1"
            local image="$2"
            local base_name="ghcr.io/prgrms-be-adv-devcourse/prompthub-${service}"
            local new_name
            local value

            if [[ "$image" == *@sha256:* ]]; then
              new_name="${image%@*}"
              value="${image#*@}"
              cat >> "$runtime_overlay/kustomization.yaml" <<EOF
            - name: $base_name
              newName: $new_name
              digest: $value
          EOF
            else
              new_name="${image%:*}"
              value="${image##*:}"
              cat >> "$runtime_overlay/kustomization.yaml" <<EOF
            - name: $base_name
              newName: $new_name
              newTag: $value
          EOF
            fi
          }

          snapshot_settlement_cronjob() {
            if [ "$settlement_cronjob_snapshot_taken" = "true" ]; then
              return
            fi

            if settlement_cronjob_previous_image="$(kubectl get cronjob "$settlement_cronjob" -n "$NAMESPACE" \
              -o jsonpath="{.spec.jobTemplate.spec.template.spec.containers[?(@.name=='settlement-service')].image}" 2>/dev/null)"; then
              if [ -z "$settlement_cronjob_previous_image" ]; then
                echo "CronJob/$settlement_cronjob 에 settlement-service 컨테이너 이미지가 없습니다." >&2
                return 1
              fi
              settlement_cronjob_existed="true"
            else
              settlement_cronjob_previous_image=""
              settlement_cronjob_existed="false"
            fi

            settlement_cronjob_snapshot_taken="true"
          }

          rollback_settlement_cronjob() {
            if [ "$settlement_cronjob_updated" != "true" ]; then
              return
            fi

            if [ "$settlement_cronjob_existed" = "true" ]; then
              kubectl set image cronjob/"$settlement_cronjob" \
                settlement-service="$settlement_cronjob_previous_image" -n "$NAMESPACE"
            else
              kubectl delete cronjob/"$settlement_cronjob" -n "$NAMESPACE" --ignore-not-found
            fi
          }

          snapshot_manifest_deployments() {
            local deployment

            manifest_snapshot_dir="${RUNNER_TEMP}/prompthub-k8s-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            mkdir -p "$manifest_snapshot_dir"

            for deployment in "${deployment_order[@]}"; do
              if kubectl get deployment "$deployment" -n "$NAMESPACE" -o json 2>/dev/null |
                jq -cS '.spec.template' > "$manifest_snapshot_dir/$deployment.template.json"; then
                continue
              fi

              rm -f "$manifest_snapshot_dir/$deployment.template.json"
              : > "$manifest_snapshot_dir/$deployment.missing"
            done
          }

          track_manifest_deployment_changes() {
            local deployment
            local current_template
            local previous_template

            if [ -z "$manifest_snapshot_dir" ]; then
              return
            fi

            for deployment in "${deployment_order[@]}"; do
              if [ -f "$manifest_snapshot_dir/$deployment.missing" ]; then
                if kubectl get deployment "$deployment" -n "$NAMESPACE" >/dev/null 2>&1 &&
                  ! was_created "$deployment"; then
                  created_deployments+=("$deployment")
                fi
                continue
              fi

              if ! current_template="$(kubectl get deployment "$deployment" -n "$NAMESPACE" -o json |
                jq -cS '.spec.template')"; then
                continue
              fi

              previous_template="$(< "$manifest_snapshot_dir/$deployment.template.json")"
              if [ "$current_template" != "$previous_template" ] && ! was_updated "$deployment"; then
                updated_deployments+=("$deployment")
              fi
            done
          }

          rollback_deployments() {
            local exit_code="$?"
            local index
            local deployment

            trap - ERR
            set +e
            track_manifest_deployment_changes
            echo "배포 실패: 이번 실행에서 변경한 이미지 또는 Pod template을 rollback 합니다."

            rollback_settlement_cronjob

            for ((index=${#updated_deployments[@]} - 1; index >= 0; index--)); do
              deployment="${updated_deployments[$index]}"
              kubectl rollout undo deployment/"$deployment" -n "$NAMESPACE"
            done

            for ((index=${#created_deployments[@]} - 1; index >= 0; index--)); do
              deployment="${created_deployments[$index]}"
              kubectl delete deployment/"$deployment" -n "$NAMESPACE" --ignore-not-found
            done

            for deployment in "${updated_deployments[@]}"; do
              kubectl rollout status deployment/"$deployment" -n "$NAMESPACE" --timeout=10m
            done

            if [ "$config_updated" = "true" ] && [ "$APPLICATION_MANIFESTS_CHANGED" != "true" ]; then
              echo "Config rollback 값을 다시 읽도록 소비 서비스를 재시작합니다."
              for deployment in "${config_consumers[@]}"; do
                kubectl rollout restart deployment/"$deployment" -n "$NAMESPACE"
                kubectl rollout status deployment/"$deployment" -n "$NAMESPACE" --timeout=10m
              done
            fi

            exit "$exit_code"
          }

          trap rollback_deployments ERR

          if [ "$APPLICATION_MANIFESTS_CHANGED" = "true" ]; then
            runtime_overlay="k8s/overlays/ec2-kubeadm/.runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            mkdir -p "$runtime_overlay"

            cat > "$runtime_overlay/kustomization.yaml" <<EOF
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          resources:
            - ../applications
          images:
          EOF

            for service in "${release_order[@]}"; do
              desired_images["$service"]="$(current_or_base_image "$service")"
              append_image_override "$service" "${desired_images[$service]}"
            done

            kubectl kustomize "$runtime_overlay" >/dev/null
            kubectl apply --dry-run=server -k "$runtime_overlay"

            snapshot_manifest_deployments
            snapshot_settlement_cronjob
            kubectl apply -k "$runtime_overlay"
            settlement_cronjob_updated="true"
            track_manifest_deployment_changes

            expected_settlement_image="${desired_images[settlement-service]}"
            current_settlement_image="$(kubectl get cronjob "$settlement_cronjob" -n "$NAMESPACE" \
              -o jsonpath="{.spec.jobTemplate.spec.template.spec.containers[?(@.name=='settlement-service')].image}")"
            if [ "$current_settlement_image" != "$expected_settlement_image" ]; then
              echo "CronJob 이미지 검증 실패: $current_settlement_image" >&2
              exit 1
            fi

            for deployment in "${deployment_order[@]}"; do
              kubectl rollout status deployment/"$deployment" -n "$NAMESPACE" --timeout=10m
            done

            config_updated="true"
          fi

          for service in "${release_order[@]}"; do
            if ! image="$(jq -er --arg service "$service" '.[$service].immutableRef // empty' <<< "$RELEASE_MANIFEST")"; then
              continue
            fi

            if [ "$service" = "settlement-service" ]; then
              snapshot_settlement_cronjob
              current_image="$(kubectl get cronjob "$settlement_cronjob" -n "$NAMESPACE" \
                -o jsonpath="{.spec.jobTemplate.spec.template.spec.containers[?(@.name=='settlement-service')].image}")"

              if [ "$current_image" = "$image" ]; then
                echo "이미 배포된 이미지이므로 건너뜁니다: settlement-service -> $image"
                continue
              fi

              kubectl set image cronjob/"$settlement_cronjob" settlement-service="$image" -n "$NAMESPACE"
              settlement_cronjob_updated="true"
              kubectl annotate cronjob/"$settlement_cronjob" \
                kubernetes.io/change-cause="GitHub Actions $GITHUB_SHA" -n "$NAMESPACE" --overwrite

              deployed_image="$(kubectl get cronjob "$settlement_cronjob" -n "$NAMESPACE" \
                -o jsonpath="{.spec.jobTemplate.spec.template.spec.containers[?(@.name=='settlement-service')].image}")"
              if [ "$deployed_image" != "$image" ]; then
                echo "CronJob 이미지 갱신 실패: $deployed_image" >&2
                exit 1
              fi
              continue
            fi

            current_image="$(kubectl get deployment "$service" -n "$NAMESPACE" -o jsonpath="{.spec.template.spec.containers[?(@.name=='$service')].image}")"

            if [ "$current_image" = "$image" ]; then
              echo "이미 배포된 이미지이므로 건너뜁니다: $service -> $image"
              continue
            fi

            kubectl set image deployment/"$service" "$service=$image" -n "$NAMESPACE"
            updated_deployments+=("$service")

            kubectl annotate deployment/"$service" kubernetes.io/change-cause="GitHub Actions $GITHUB_SHA" -n "$NAMESPACE" --overwrite
            kubectl rollout status deployment/"$service" -n "$NAMESPACE" --timeout=10m

            if [ "$service" = "config" ]; then
              config_updated="true"
            fi
          done

          if [ "$config_updated" = "true" ] && [ "$APPLICATION_MANIFESTS_CHANGED" != "true" ]; then
            echo "새 Config 값을 읽도록 이미지가 바뀌지 않은 소비 서비스를 재시작합니다."
            for deployment in "${config_consumers[@]}"; do
              if was_updated "$deployment"; then
                continue
              fi

              kubectl rollout restart deployment/"$deployment" -n "$NAMESPACE"
              kubectl rollout status deployment/"$deployment" -n "$NAMESPACE" --timeout=10m
            done
          fi

          # CronJob 전환 이후에는 legacy 리소스 정리 실패가 새 CronJob까지 rollback하지 않게 한다.
          trap - ERR

          if [ "$APPLICATION_MANIFESTS_CHANGED" = "true" ]; then
            kubectl delete deployment/settlement-service -n "$NAMESPACE" --ignore-not-found
            kubectl delete service/settlement-service -n "$NAMESPACE" --ignore-not-found
          fi

          kubectl get deployment -n "$NAMESPACE" -o custom-columns=NAME:.metadata.name,READY:.status.readyReplicas,IMAGE:.spec.template.spec.containers[0].image
          kubectl get cronjob "$settlement_cronjob" -n "$NAMESPACE" -o custom-columns=NAME:.metadata.name,SCHEDULE:.spec.schedule,IMAGE:.spec.jobTemplate.spec.template.spec.containers[0].image
